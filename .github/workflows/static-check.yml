# 静态检查工作流
# 适用场景：push / PR 时对仓库做自动化检查
# 设计原因：本项目的构建依赖 DDEShell / DTK6（deepin 仓库提供），GitHub 托管
# runner 上无法安装，因此无法在此做完整构建或单元测试——这一层只能覆盖
# "不需要 deepin 生态"的检查，完整构建与 ctest 仍需在 deepin 环境执行（见 README）。
#
# 覆盖范围与取舍：
#   - shellcheck：脚本语法与常见坑
#   - 版本一致性：CMake / CHANGELOG / git tag 三处版本号漂移（scripts/check-version.py）
#   - 翻译同步：源码 qsTr() 与 .ts 是否一一对应（scripts/check-translations.py）
#   - QML 语法：用 ubuntu 的 Qt6 做 qmllint 语法级检查。注意 deepin 的
#     org.deepin.dtk / org.deepin.ds 模块在 runner 上不存在，因此只能卡"语法错误"，
#     不能卡 import 类告警，否则会整片飘红
#   - shell 脚本语法：bash -n（比 shellcheck 更基础，作为兜底）
name: static-check

on:
  push:
  pull_request:

# 只读权限即可；显式声明避免默认 token 权限过宽
permissions:
  contents: read

# 同一分支的新推送取消上一次未完成的运行，避免排队浪费
concurrency:
  group: static-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash 语法检查
        run: |
          bash -n install.sh
          bash -n build-deb.sh

      # -S error：只让 error 级别失败，warning/info 仍会打印但不阻断
      # 设计原因：既有脚本未做过 shellcheck 清理，若一次性拉满阈值会让 CI 长期为红，
      # 反而失去信号意义；先卡错误，警告随改动逐步收敛
      - name: shellcheck（error 级别）
        run: shellcheck -S error install.sh build-deb.sh

  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本一致性检查要读 git tag，浅克隆会拿不到标签
          fetch-depth: 0

      - name: 版本号一致性
        run: python3 scripts/check-version.py

      - name: 翻译同步
        run: python3 scripts/check-translations.py

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装编译工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qt6-base-dev

      # 只编译纯逻辑核心库与其测试，**不编译主插件**：
      # NetworkMonitorApplet 继承 DApplet，需要 Dtk6::Core 与 Dde::Shell，
      # 这两者只在 deepin 仓库提供，GitHub runner 装不了。
      # jnetcore 只依赖 Qt6::Core，因此这段能在通用环境真实跑通。
      - name: 构建核心库并运行单元测试
        run: |
          set -e
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
                -DJNET_BUILD_PLUGIN=OFF 2>&1 | tail -20
          cmake --build build --target tst_core -j"$(nproc)"
          # 显式断言测试确实存在：Qt6::Test 缺失时 ctest 会报 0 个测试，
          # 那种情况下"通过"毫无意义
          ctest --test-dir build --output-on-failure -R tst_core

      # 兜底：确认测试二进制真的产生了用例（防止 configure 静默跳过测试目标）
      - name: 校验测试数量非零
        run: |
          count=$(./build/tst_core 2>&1 | grep -oP 'Totals: \K[0-9]+' | head -1)
          echo "执行用例数：$count"
          if [ -z "$count" ] || [ "$count" -eq 0 ]; then
            echo "::error::单元测试未执行任何用例，检查 Qt6::Test 是否安装"
            exit 1
          fi

  qml-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt6 QML 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools

      # 只把"语法级"错误视为失败：org.deepin.dtk / org.deepin.ds 在 runner 上
      # 必然缺失，若把 import 告警也算失败，这个 job 会永远为红、失去信号价值。
      # 因此这里显式过滤，仅当出现语法类错误时才退出非零。
      - name: qmllint（仅语法级错误）
        run: |
          set -o pipefail
          fail=0
          for f in package/*.qml package/components/*.qml; do
            # 收集输出后过滤掉 import 相关噪声
            out=$(qmllint "$f" 2>&1 || true)
            syntax=$(printf '%s\n' "$out" | grep -E "Syntax error|Expected token|Unable to assign|is not a type" || true)
            if [ -n "$syntax" ]; then
              echo "::error file=$f::$syntax"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "QML 语法检查通过"
          exit "$fail"
