# 静态检查工作流
# 适用场景：push / PR 时对仓库做自动化检查
# 设计原因：本项目的构建依赖 DDEShell / DTK6（deepin 仓库提供），GitHub 托管
# runner 上无法安装，因此无法在此做完整构建或单元测试——这一层只能覆盖
# "不需要 deepin 生态"的检查，完整构建与 ctest 仍需在 deepin 环境执行（见 README）。
#
# 覆盖范围与取舍：
#   - shellcheck：脚本语法与常见坑
#   - 版本一致性：CMake / CHANGELOG / git tag 三处版本号漂移（scripts/check-version.py）
#   - 翻译同步：源码 qsTr() 与 .ts 是否一一对应（scripts/check-translations.py）
#   - QML 语法：用 ubuntu 的 Qt6 做 qmllint 语法级检查。注意 deepin 的
#     org.deepin.dtk / org.deepin.ds 模块在 runner 上不存在，因此只能卡"语法错误"，
#     不能卡 import 类告警，否则会整片飘红
#   - shell 脚本语法：bash -n（比 shellcheck 更基础，作为兜底）
name: static-check

on:
  push:
  pull_request:

# 只读权限即可；显式声明避免默认 token 权限过宽
permissions:
  contents: read

# 同一分支的新推送取消上一次未完成的运行，避免排队浪费
concurrency:
  group: static-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash 语法检查
        run: |
          bash -n install.sh
          bash -n build-deb.sh

      # -S error：只让 error 级别失败，warning/info 仍会打印但不阻断
      # 设计原因：既有脚本未做过 shellcheck 清理，若一次性拉满阈值会让 CI 长期为红，
      # 反而失去信号意义；先卡错误，警告随改动逐步收敛
      - name: shellcheck（error 级别）
        run: shellcheck -S error install.sh build-deb.sh

  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本一致性检查要读 git tag，浅克隆会拿不到标签
          fetch-depth: 0

      - name: 版本号一致性
        run: python3 scripts/check-version.py

      - name: 翻译同步
        run: python3 scripts/check-translations.py

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装编译工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qt6-base-dev

      # 只编译纯逻辑核心库与其测试，**不编译主插件**：
      # NetworkMonitorApplet 继承 DApplet，需要 Dtk6::Core 与 Dde::Shell，
      # 这两者只在 deepin 仓库提供，GitHub runner 装不了。
      # jnetcore 只依赖 Qt6::Core，因此这段能在通用环境真实跑通。
      - name: 构建核心库并运行单元测试
        run: |
          set -e
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
                -DJNET_BUILD_PLUGIN=OFF 2>&1 | tail -20
          cmake --build build --target tst_core -j"$(nproc)"
          # 显式断言测试确实存在：Qt6::Test 缺失时 ctest 会报 0 个测试，
          # 那种情况下"通过"毫无意义
          ctest --test-dir build --output-on-failure -R tst_core

      # 兜底：确认测试二进制真的产生了用例（防止 configure 静默跳过测试目标）
      - name: 校验测试数量非零
        run: |
          count=$(./build/tst_core 2>&1 | grep -oP 'Totals: \K[0-9]+' | head -1)
          echo "执行用例数：$count"
          if [ -z "$count" ] || [ "$count" -eq 0 ]; then
            echo "::error::单元测试未执行任何用例，检查 Qt6::Test 是否安装"
            exit 1
          fi

  qml-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt6 QML 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools

      # 分两档检查强度，依据：networkview.qml 的根元素是 AppletItem，
      # 它是 dde-shell 的 C++ 注册类型，runner 上无该模块时 qmllint 解析不了，
      # 会把其子项属性全报成"不存在"（v2.3.0 这一可正常加载的版本同样报 2 条，
      # 证明是解析失败导致的误报，不是真实缺陷）。
      #
      #   一档（13 个文件）：语法 + **属性存在性**都必须干净。
      #     属性存在性必须卡：真实事故是给 ColumnLayout 写了 topPadding，
      #     一行错误让整个 SettingsWindow 类型不可用，入口 QML 加载失败，
      #     插件直接从任务栏消失。它只表现为 missing-property 告警。
      #   二档（networkview.qml）：只查语法。它的 AppletItem 属性契约由
      #     scripts/check-qml-runtime.py 的白名单负责。
      - name: qmllint（13 个文件：语法 + 属性存在性；入口文件：语法）
        run: |
          set -o pipefail
          fail=0
          NOISE="org\.deepin|dtk6declarative|Ambiguous type|Warnings occurred while importing|Failed to import|qmldir but does not exist|^import |^\s*\^|^---|^$"
          for f in $(ls package/*.qml package/components/*.qml | grep -v '^package/networkview\.qml$'); do
            out=$(qmllint "$f" 2>&1 || true)
            fatal=$(printf '%s\n' "$out" | grep -vE "$NOISE" \
              | grep -E "Syntax error|Expected token|Unable to assign|is not a type|does not exist\.|Cannot assign to non-existent" || true)
            if [ -n "$fatal" ]; then
              echo "::error file=$f::$(echo "$fatal" | head -1)"
              printf '%s\n' "$fatal"
              fail=1
            fi
          done
          if [ "$fail" -eq 0 ]; then
            echo "✓ 13 个组件：语法与属性存在性均干净"
          fi

          # 入口文件：只卡语法级错误
          out=$(qmllint package/networkview.qml 2>&1 || true)
          syntax=$(printf '%s\n' "$out" | grep -vE "$NOISE" \
            | grep -E "Syntax error|Expected token|Unable to assign to a property of required type|is not a type" || true)
          if [ -n "$syntax" ]; then
            echo "::error file=package/networkview.qml::$(echo "$syntax" | head -1)"
            printf '%s\n' "$syntax"
            fail=1
          else
            echo "✓ 入口文件：语法干净"
          fi
          exit "$fail"

  # dde-shell 注册类型的属性契约 + import 版本号校验。
  # 这两类错误 qmllint 拦不住：前者是 C++ 注册类型（无 qmltypes 可推导），
  # 后者需要比对模块实际导出的版本。二者都曾让插件从任务栏彻底消失。
  qml-runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt6 QML 模块（用于读取模块导出信息）
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev qml6-module-qtquick-dialogs

      - name: 校验 import 版本与 dde-shell 类型属性
        run: |
          # 优先问 qmake6 要真实路径；它不存在时按 Ubuntu 标准路径回退。
          # 脚本对"显式指定但不存在"的路径会报错（防止装包失败时静默通过），
          # 因此这里额外列出候选路径供排查
          QMLDIR=$(qmake6 -query QT_INSTALL_QML 2>/dev/null || true)
          if [ -z "$QMLDIR" ] || [ ! -d "$QMLDIR" ]; then
            QMLDIR=/usr/lib/x86_64-linux-gnu/qt6/qml
          fi
          echo "QML 模块根目录：$QMLDIR"
          if [ ! -d "$QMLDIR" ]; then
            echo "::error::找不到 Qt QML 模块目录，无法校验 import 版本"
            ls -d /usr/lib/*/qt6/qml /usr/lib/qt6/qml 2>/dev/null || true
            exit 1
          fi
          python3 scripts/check-qml-runtime.py --qml-dir "$QMLDIR"
